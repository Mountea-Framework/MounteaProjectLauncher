name: Launcher quality

on:
  pull_request:
  push:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:syntax
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node --check dist-electron/main.cjs
      - run: node --check dist-electron/preload.cjs
